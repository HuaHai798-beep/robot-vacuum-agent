# 模型价格表（元 / 1K tokens）
# ⚠️ 以阿里云百炼控制台当期价格为准，每月核对一次；脚本只做计算，不保证价格准确
qwen-plus:
  input: 0.0008
  output: 0.002
qwen-turbo:
  input: 0.0003
  output: 0.0006
qwen-max:
  input: 0.0024
  output: 0.0096
deepseek-chat:
  input: 0.002      # 约 2 元/百万 tokens
  output: 0.008     # 约 8 元/百万 tokens

# 重排模型（v1.9 新增埋点）
# input：元 / 1K tokens（按文档 tokens 计费时填这里）
# call ：元 / 次（如果控制台按调用次数计费，填这里；两者可同时存在）
# 留 0 = 该费用不计入，报告里会显式标注「未计价」，避免用假单价污染成本结论
rerank:
  model: qwen3.7-text-rerank
  input: 0.0
  call: 0.0
