collection_name: agent
persist_directory: rag/chroma_db
k: 3
data_path: data
md5_hex_store: md5.text
allow_knowledge_file_type: ["txt", "pdf"]

chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]

# 检索重排
rerank_enabled: true
rerank_candidates: 10
rerank_method: api
rerank_model: qwen3.7-text-rerank
